name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs answer one question: will the next release publish to PyPI?
  # A Trusted Publisher lives in a PyPI account, so nothing in this repository
  # can answer that -- and finding out by cutting a release is a terrible way to
  # learn it. See the verify-pypi-publisher job.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-pypi-publisher:
    # A dry run of the ONLY thing a release cannot check for itself.
    #
    # Trigger it by hand (Actions -> Release -> Run workflow) after registering a
    # pending publisher at pypi.org. It exchanges an OIDC token exactly as the
    # publish step does and reports whether PyPI accepts this workflow, without
    # building or tagging anything. The alternative -- cutting a release to find
    # out -- burns a version number on a configuration question.
    #
    # Skipped entirely on tag pushes: a release must not depend on it, and
    # check-pypi-publisher already gates the real upload.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Exchange a token with PyPI and report the verdict
        run: |
          set -uo pipefail
          audience=$(curl -fsS https://pypi.org/_/oidc/audience \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])' \
            || echo pypi)
          oidc=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          # The response body carries a real short-lived upload token on success,
          # so only the status code is ever read. The request goes through a file
          # so the OIDC token never lands in a process argument list.
          printf '{"token": "%s"}' "$oidc" > mint-request.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @mint-request.json \
            "https://pypi.org/_/oidc/mint-token")
          rm -f mint-request.json
          {
            if [ "$code" = "200" ]; then
              echo "### ✅ PyPI accepts this workflow"
              echo
              echo "A Trusted Publisher is configured and matches. The next"
              echo "\`v*\` tag will publish to PyPI."
            else
              echo "### ❌ PyPI refused the token exchange (HTTP $code)"
              echo
              echo "No matching Trusted Publisher. Register a **pending publisher**"
              echo "at <https://pypi.org/manage/account/publishing/> with exactly:"
              echo
              echo "| field | value |"
              echo "| --- | --- |"
              echo "| PyPI Project Name | \`zeline\` |"
              echo "| Owner | \`${GITHUB_REPOSITORY%%/*}\` |"
              echo "| Repository name | \`${GITHUB_REPOSITORY##*/}\` |"
              echo "| Workflow name | \`release.yml\` |"
              echo "| Environment name | \`pypi\` |"
              echo
              echo "All five must match character for character — the project"
              echo "name is compared against the package metadata at upload time,"
              echo "and the other four against this workflow's OIDC claims."
              echo "Re-run this job to confirm before cutting a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # Never fail: this job reports a configuration fact, and a red X here
          # would be the same misleading signal it exists to remove.
          exit 0

  build-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag belongs to merged main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag equals package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build immutable release artifacts
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/zeline-*.whl dist/zeline-*.tar.gz
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum zeline-*.whl zeline-*.tar.gz install.sh install.ps1 > SHA256SUMS
      - name: Verify artifacts before publish
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          python - <<'PY'
          from pathlib import Path
          import email.parser
          import os
          import re
          import tarfile
          import zipfile

          expected_version = os.environ["PACKAGE_VERSION"]
          wheels = list(Path('.').glob('zeline-*.whl'))
          sdists = list(Path('.').glob('zeline-*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected exactly one wheel and one sdist: wheels={wheels}; sdists={sdists}")
          wheel, sdist = wheels[0], sdists[0]
          blocked_markers = (
              "__pycache__", ".pytest_cache", ".zeline",
              "tmdb-media-web-maintenance",
          )
          blocked_suffixes = (".pyc", ".pyo", ".pem", ".key")

          def blocked(names):
              return [
                  name for name in names
                  if any(marker in name for marker in blocked_markers)
                  or any(part == ".env" for part in Path(name).parts)
                  or name.endswith(blocked_suffixes)
              ]

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
              wheel_blocked = blocked(wheel_names)
              metadata_name = next(name for name in wheel_names if name.endswith('.dist-info/METADATA'))
              metadata = email.parser.Parser().parsestr(archive.read(metadata_name).decode('utf-8'))
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()
              sdist_blocked = blocked(sdist_names)
              expected_pkg_info = f"zeline-{expected_version}/PKG-INFO"
              pkg_info_members = [
                  member for member in archive.getmembers()
                  if member.isfile() and member.name == expected_pkg_info
              ]
              if len(pkg_info_members) != 1:
                  raise SystemExit(f"expected canonical sdist PKG-INFO: {pkg_info_members}")
              pkg_info_file = archive.extractfile(pkg_info_members[0])
              if pkg_info_file is None:
                  raise SystemExit("could not read sdist PKG-INFO")
              pkg_info = email.parser.Parser().parsestr(pkg_info_file.read().decode('utf-8'))

          if wheel_blocked or sdist_blocked:
              raise SystemExit(f"blocked release entries: wheel={wheel_blocked}; sdist={sdist_blocked}")
          if metadata.get('Name') != 'zeline' or metadata.get('Version') != expected_version:
              raise SystemExit(f"invalid wheel metadata: {metadata.get('Name')} {metadata.get('Version')}")
          if pkg_info.get('Name') != 'zeline' or pkg_info.get('Version') != expected_version:
              raise SystemExit(f"invalid sdist metadata: {pkg_info.get('Name')} {pkg_info.get('Version')}")
          if not re.fullmatch(rf"zeline-{re.escape(expected_version)}-py3-none-any\.whl", wheel.name):
              raise SystemExit(f"unexpected wheel filename: {wheel.name}")
          if sdist.name != f"zeline-{expected_version}.tar.gz":
              raise SystemExit(f"unexpected sdist filename: {sdist.name}")
          PY
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/zeline-*.whl
            dist/zeline-*.tar.gz
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Zeline ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/zeline-*.whl
            dist/zeline-*.tar.gz
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
      - name: Upload distributions for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/zeline-*.whl
            dist/zeline-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  check-pypi-publisher:
    # Does PyPI actually accept this workflow's identity? Nothing else can answer
    # that: a Trusted Publisher lives in a PyPI account, not in this repository,
    # so the workflow cannot know from its own files whether an upload will work.
    #
    # Without this gate `publish-pypi` fails with `invalid-publisher` on every
    # release until someone configures the publisher -- a red job and a red
    # `pypi` deployment on the repository page, for a release that was otherwise
    # completely successful. Worse, it trains the maintainer to ignore red.
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      armed: ${{ steps.probe.outputs.armed }}
    steps:
      - name: Ask PyPI whether a Trusted Publisher exists for this workflow
        id: probe
        run: |
          set -euo pipefail
          audience=$(curl -fsS https://pypi.org/_/oidc/audience \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])' \
            || echo pypi)
          # An OIDC token identifying this workflow run. Not a PyPI credential.
          oidc=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          # Exchange it exactly as gh-action-pypi-publish does -- the only check
          # that reflects reality rather than guessing from the project's
          # existence. On success the body carries a real short-lived upload
          # token, so it goes to /dev/null and is never logged or stored; only
          # the status code is read. The payload goes through a file so the OIDC
          # token never appears in a process argument list either.
          printf '{"token": "%s"}' "$oidc" > mint-request.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @mint-request.json \
            "https://pypi.org/_/oidc/mint-token")
          rm -f mint-request.json
          if [ "$code" = "200" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "PyPI accepted this workflow's identity — publishing."
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PyPI refused the token exchange (HTTP $code); skipping the upload."
            echo
            echo "No Trusted Publisher is configured for this repository yet, so"
            echo "there is nothing to upload to. The GitHub release above is"
            echo "unaffected: its assets are built, checksum-verified, attested,"
            echo "and published."
            echo
            echo "To arm it, at pypi.org -> Publishing -> add a pending publisher:"
            echo "  owner       : ${GITHUB_REPOSITORY%%/*}"
            echo "  repository  : ${GITHUB_REPOSITORY##*/}"
            echo "  workflow    : release.yml"
            echo "  environment : pypi"
            echo "All four must match exactly. The next release then publishes"
            echo "with no further changes here."
          fi

  publish-pypi:
    # Runs only after the artifacts above passed checksum + metadata
    # verification, and publishes those same files -- never a rebuild, so the
    # bytes on PyPI match the bytes attested in the GitHub release.
    #
    # Gated on the probe rather than allowed to fail: a skipped job says "not
    # configured", a failed job says "broken", and only one of those is true.
    # `environment:` also means a *job* deployment record -- so gating the job
    # (not a step inside it) is what keeps a phantom `pypi` deployment off the
    # repository page while no publisher exists.
    needs: [build-release, check-pypi-publisher]
    if: needs.check-pypi-publisher.outputs.armed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zeline
    permissions:
      # Trusted Publishing (OIDC). No API token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Only the wheel and sdist may be uploaded
        run: |
          ls -l dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test -n "$(find dist -maxdepth 1 -name 'zeline-*-py3-none-any.whl')"
          test -n "$(find dist -maxdepth 1 -name 'zeline-*.tar.gz')"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
