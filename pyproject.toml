[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeline"
version = "0.2.4"
description = "Zeline — an open-source agentic AI framework by Zerolinear."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Mahesa F. Ferdinand"},
]
keywords = ["ai", "agent", "llm", "telegram", "whatsapp", "openai-compatible"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
zeline = "zeline.cli:main"

[project.urls]
Homepage = "https://github.com/Mftrferdinand/Zeline"
Repository = "https://github.com/Mftrferdinand/Zeline"
Issues = "https://github.com/Mftrferdinand/Zeline/issues"

[tool.setuptools.packages.find]
include = ["zeline", "zeline.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
zeline = ["SOUL.md", "skills/*.md", "skills/**/*", "zenith_tools/**/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*", "**/*.pyc", "**/*.pyo", "**/__pycache__/*"]

[tool.setuptools]
include-package-data = true

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
