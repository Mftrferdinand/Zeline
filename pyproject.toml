[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeline"
version = "0.4.5"
description = "Zeline — an open-source agentic AI framework by Zerolinear."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Mahesa F. Ferdinand"},
]
keywords = ["ai", "agent", "llm", "telegram", "whatsapp", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Communications :: Chat",
]
dependencies = [
    "requests[socks]>=2.28",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "tzdata>=2024.1",
    # Native static JavaScript parsing; no Node.js, REA, daemon or remote service.
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    # Static instruction decoding in a bounded trusted worker; no target execution.
    "capstone==5.0.9",
    # Local chat UI: Markdown/code rendering and the multiline composer.
    # Both degrade to plain output when unavailable, so the CLI never hard-fails.
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.16", "pytest>=8,<10", "pytest-subtests>=0.14,<1"]
optimizer = ["gepa==0.1.4"]
reverse-ts = ["tree-sitter-typescript==0.23.2"]

[project.scripts]
zeline = "zeline.cli:main"

[project.urls]
Homepage = "https://zeline.zerolinear.com"
Documentation = "https://zeline.zerolinear.com/installation.html"
Repository = "https://github.com/Mftrferdinand/Zeline"
Issues = "https://github.com/Mftrferdinand/Zeline/issues"
Changelog = "https://github.com/Mftrferdinand/Zeline/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["zeline", "zeline.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
zeline = ["SOUL.md", "skills/*.md", "skills/**/*", "zenith_tools/**/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*", "**/*.pyc", "**/*.pyo", "**/__pycache__/*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "zeline/skills"]

[tool.ruff.lint]
# The gate starts at correctness rules only: undefined names, broken f-strings,
# unreachable/invalid syntax, mistaken comparisons. These are bugs, not taste,
# so CI can block on them without a mass reformat of a working codebase.
# Style and typing-modernization rules are tracked separately -- see
# CONTRIBUTING.md -- and get promoted into `select` as they are cleared.
select = [
    "E9",   # SyntaxError
    "F63",  # f-string invalid
    "F7",   # from __future__ imports
    "F82",  # undefined name
    "E",    # pycodestyle (style)
    "W",    # pycodestyle warnings
    "I",    # isort (imports)
    "C90",  # mccabe complexity
]

[tool.ruff.lint.per-file-ignores]
"zeline/skills/**/*.py" = ["E", "W", "I", "C90"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=zeline",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=60",
]
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring external services (gateway, browser, MCP)",
    "slow: tests taking >5s",
]

[tool.coverage.run]
source = ["zeline"]
omit = [
    "zeline/skills/*",
    "zeline/zenith_tools/*",
    "*/tests/*",
    "*/test_*.py",
]
branch = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
