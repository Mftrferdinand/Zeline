[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeline"
version = "0.2.8"
description = "Zeline — an open-source agentic AI framework by Zerolinear."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Mahesa F. Ferdinand"},
]
keywords = ["ai", "agent", "llm", "telegram", "whatsapp", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "requests[socks]>=2.28",
  "PyYAML>=6.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.16"]

[project.scripts]
zeline = "zeline.cli:main"

[project.urls]
# Homepage points at the repository, not zeline.<the project domain>, because
# that domain does not resolve yet and PyPI renders this as a clickable sidebar
# link on every visit. Switch it once DNS is live -- a 404 on the project page
# is worse than a plain GitHub link.
Homepage = "https://github.com/Mftrferdinand/Zeline"
Documentation = "https://github.com/Mftrferdinand/Zeline/blob/main/docs/installation.md"
Repository = "https://github.com/Mftrferdinand/Zeline"
Issues = "https://github.com/Mftrferdinand/Zeline/issues"
Changelog = "https://github.com/Mftrferdinand/Zeline/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["zeline", "zeline.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
zeline = ["SOUL.md", "skills/*.md", "skills/**/*", "zenith_tools/**/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*", "**/*.pyc", "**/*.pyo", "**/__pycache__/*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "zeline/skills"]

[tool.ruff.lint]
# The gate starts at correctness rules only: undefined names, broken f-strings,
# unreachable/invalid syntax, mistaken comparisons. These are bugs, not taste,
# so CI can block on them without a mass reformat of a working codebase.
# Style and typing-modernization rules are tracked separately -- see
# CONTRIBUTING.md -- and get promoted into `select` as they are cleared.
select = ["E9", "F63", "F7", "F82"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
